name: Equipment Rental Management CI

on:
  push:
  pull_request:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equipment-rental-management
    
    steps:
    - name: Checkout code  
      uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: 3.13
    
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -r requirements.txt
    
    - name: Run tests with coverage
      run: |
        python3 -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90